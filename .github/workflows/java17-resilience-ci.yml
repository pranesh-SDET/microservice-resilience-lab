name: Java 17 Resilience CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  resilience-suite:
    runs-on: ubuntu-latest

    services:
      kafka:
        image: apache/kafka:4.4.0
        ports:
          - 9092:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait until the Kafka broker answers
        run: |
          CID=$(docker ps -q --filter ancestor=apache/kafka:4.4.0)
          for i in {1..30}; do
            if docker exec "$CID" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi
            echo "Waiting for Kafka..."
            sleep 2
          done
          echo "Kafka did not start in time"
          docker logs "$CID" | tail -50
          exit 1

      - name: Run full TestNG suite (Kafka + WireMock)
        run: mvn -B clean test
